name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build, unit tests, crash test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Locate server binary
        shell: bash
        run: |
          bin=$(find build -name 'kvlog-server' -o -name 'kvlog-server.exe' | head -1)
          echo "SERVER=$(cd "$(dirname "$bin")" && pwd)/$(basename "$bin")" >> "$GITHUB_ENV"
      - name: Crash test, fsync=always, with COMPACT in some rounds (every acknowledged write must survive)
        shell: bash
        run: python scripts/crash_test.py --server "$SERVER" --rounds 20
      - name: Crash test, fsync=everysec (process kill must not lose acknowledged writes either)
        shell: bash
        run: python scripts/crash_test.py --server "$SERVER" --rounds 10 --fsync everysec
      - name: Negative control (server replies before writing; the test must report data loss, exit 3)
        shell: bash
        run: |
          set +e
          python scripts/crash_test.py --server "$SERVER" --rounds 10 --fsync no --unsafe
          code=$?
          if [ "$code" -ne 3 ]; then
            echo "::error::expected exit 3 (acknowledged writes lost), got $code; the crash test is not detecting loss"
            exit 1
          fi
          echo "negative control lost data as expected"

  bench:
    name: Benchmark vs Redis (same runner, same client)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install Redis
        run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-server && redis-server --version
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: redis-cli works against kvlog
        run: |
          ./build/kvlog-server --port 6399 --no-log 2>/dev/null &
          for i in $(seq 1 50); do redis-cli -p 6399 PING >/dev/null 2>&1 && break; sleep 0.1; done
          test "$(redis-cli -p 6399 SET greeting hello)" = "OK"
          test "$(redis-cli -p 6399 GET greeting)" = "hello"
          test "$(redis-cli -p 6399 DEL greeting nothing)" = "1"
          redis-cli -p 6399 SET k v >/dev/null && test "$(redis-cli -p 6399 EXISTS k)" = "1"
          kill %1
      - name: Run
        run: |
          echo "runner vCPUs: $(nproc)"
          bash bench/run_vs_redis.sh build/kvlog-bench build/kvlog-server build/kvlog-server-fsync | tee results.jsonl
      - name: Summary
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          rows = [json.loads(l) for l in open("results.jsonl") if l.startswith("{")]
          print("| server/mode | pipeline | ops/s | p50 µs | p99 µs | failures |\n|---|---:|---:|---:|---:|---:|")
          for r in rows:
              print(f"| {r['label']} | {r['pipeline']} | {r['ops_per_sec']:,.0f} | {r['p50_us']:.0f} | {r['p99_us']:.0f} | {r['failures']} |")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: results.jsonl
